worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    client_max_body_size 100M;      # for future direct file uploads

    # gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json
        application/xml application/xml+rss
        image/svg+xml;

    # ── upstream ──────────────────────────────────────────────────────────
    upstream api_backend {
        server api:4500;            # compose DNS name
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security headers ───────────────────────────────────────────────
        add_header X-Content-Type-Options    "nosniff"          always;
        add_header X-Frame-Options           "SAMEORIGIN"       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=()"   always;
        # CSP — tighten as you add third-party scripts.
        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; script-src 'self'" always;

        # ── SPA ────────────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite emits hashed asset names — cache forever.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # No cache for the SPA entrypoint, ever.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # ── API proxy ──────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # Preserve client identity; keep Host so cookies scope correctly.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            # Cookies: FastAPI-style Cookie header is passed through untouched.
            # If your Go handlers set Path=/ explicitly, no proxy_cookie_path
            # rewrite is needed. Uncomment only if you need to change it:
            # proxy_cookie_path / /;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       off;   # important for streaming downloads
        }

        # ── Health probe for orchestration ─────────────────────────────────
        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        # Block other noisy / stale endpoint prefixes
        location ~ /\. { deny all; }
    }
}